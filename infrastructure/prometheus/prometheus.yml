global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # API on the host (dev) — in the prod compose the `api` service target wins;
  # a down target is normal for whichever environment you are not in.
  - job_name: opspilot-api
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels: { env: dev }
      - targets: ["api:4000"]
        labels: { env: prod }

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
