name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w apps/api

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Typecheck
        run: |
          npx tsc --noEmit -p apps/api/tsconfig.json
          npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Unit tests
        run: npm test --workspaces --if-present

      # if: always() — publish results whether tests passed or failed, so a
      # failure shows exactly which test cases broke, not just a red job.
      # Renders the jest-junit XML as a per-test Markdown table on the Job
      # Summary. (A Checks-API reporter — dorny/test-reporter — was tried
      # first, but its Check Run silently never appeared despite a green
      # step and an explicit token; this needs no extra permissions and is
      # verified to work.)
      - name: Publish test results
        if: always()
        run: node .github/scripts/summarize-tests.mjs apps/api/test-results/junit.xml

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Docker build (no push — PR gate)
        run: |
          docker build -f apps/api/Dockerfile -t opspilot-api:ci .
          docker build -f apps/web/Dockerfile -t opspilot-web:ci .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deployment lives in deploy.yml: push GHCR images → SSH deploy →
  # health gate → automatic rollback to the previous tag
