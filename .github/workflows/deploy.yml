name: Deploy

# Push to main (or manual dispatch) → build & push GHCR images tagged with the
# git SHA → deploy over SSH with a health gate and automatic rollback
# (docs/02 §4). The deploy job is dormant until a DEPLOY_HOST secret exists.
# Registry note: docs specify ECR; GHCR is used until AWS is wired up — the
# swap is the two registry-login lines below.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository }}-api
  WEB_IMAGE_NAME: ${{ github.repository }}-web

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          echo "api_image=${REGISTRY}/${API_IMAGE_NAME@L}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${WEB_IMAGE_NAME@L}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image (also tagged latest)
        run: |
          docker build -f apps/api/Dockerfile -t "${{ steps.meta.outputs.api_image }}" .
          docker tag "${{ steps.meta.outputs.api_image }}" "${REGISTRY}/${API_IMAGE_NAME@L}:latest"
          docker push "${{ steps.meta.outputs.api_image }}"
          docker push "${REGISTRY}/${API_IMAGE_NAME@L}:latest"

      - name: Build and push web image (also tagged latest)
        run: |
          docker build -f apps/web/Dockerfile -t "${{ steps.meta.outputs.web_image }}" .
          docker tag "${{ steps.meta.outputs.web_image }}" "${REGISTRY}/${WEB_IMAGE_NAME@L}:latest"
          docker push "${{ steps.meta.outputs.web_image }}"
          docker push "${REGISTRY}/${WEB_IMAGE_NAME@L}:latest"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # Dormant until the server secrets exist
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH with health gate + rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/opspilot
            git pull --ff-only
            ./infrastructure/deploy/deploy.sh \
              "${{ needs.build-push.outputs.api_image }}" \
              "${{ needs.build-push.outputs.web_image }}"
